[package]
name = "lambda_calculus"
version = "3.5.0"
description = "A simple, zero-dependency implementation of pure lambda calculus in Safe Rust"
repository = "https://github.com/ljedrz/lambda_calculus"
documentation = "https://docs.rs/lambda_calculus"
readme = "README.md"
license = "CC0-1.0"
keywords = ["lambda", "calculus", "functional", "mathematics", "combinators"]
categories = ["data-structures", "mathematics", "parser-implementations"]
authors = ["ljedrz <ljedrz@gmail.com>"]
edition = "2024"
rust-version = "1.88"

[features]
default = ["encoding"]
backslash_lambda = []
encoding = []

[dev-dependencies]
stackler = { version = "0.1", features = ["watermark"] }
